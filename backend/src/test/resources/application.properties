spring.application.name=hub
app.jwt.secret=test-only-secret-that-is-at-least-32-chars
spring.profiles.active=test

# Isolated in-memory database so tests do not depend on a Supabase/PostgreSQL instance.
spring.datasource.url=jdbc:h2:mem:roommate_hub_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
storage.r2.enabled=false
spring.jpa.show-sql=false
