spring.application.name=hub
spring.profiles.active=test

# Database configuration for tests (uses environment variables with safe defaults - no hard-coded credentials)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/roommate_hub_test}
spring.datasource.username=${DB_USERNAME:test_user}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Explicitly specify dialect so Hibernate initializes without requiring a live DB connection metadata
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
