spring.application.name=hub

server.port=8080

# Load developer-specific settings from backend/.env when running Maven in backend/.
spring.config.import=optional:file:.env[.properties]

# MySQL config
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/roommate_hub?createDatabaseIfNotExists=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
