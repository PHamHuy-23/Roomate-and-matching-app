spring.application.name=hub

server.port=${PORT:8080}
app.jwt.secret=${JWT_SECRET}

# Load developer-specific settings from backend/.env when running Maven in backend/.
spring.config.import=optional:file:.env[.properties]

# PostgreSQL / Supabase config. Prefer the Supabase session pooler on IPv4 networks.
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/roommate_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:1}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Cloudflare R2 (S3-compatible). Secrets remain server-side only.
storage.r2.enabled=${R2_ENABLED:false}
storage.r2.endpoint=${R2_ENDPOINT:}
storage.r2.access-key-id=${R2_ACCESS_KEY_ID:}
storage.r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
storage.r2.bucket=${R2_BUCKET_NAME:}
storage.r2.private-bucket=${R2_PRIVATE_BUCKET_NAME:}
storage.r2.public-url=${R2_PUBLIC_URL:}
storage.r2.presign-duration-minutes=${R2_PRESIGN_DURATION_MINUTES:10}
storage.r2.private-read-duration-minutes=${R2_PRIVATE_READ_DURATION_MINUTES:2}
storage.r2.max-upload-bytes=${R2_MAX_UPLOAD_BYTES:5242880}

# Spring Mail (SMTP) Config
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
